services:
  - type: web
    name: docuflow-converter
    runtime: docker
    plan: starter
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: docuflow-db
          property: connectionString
    disk:
      name: docuflow-files
      mountPath: /app/storage
      sizeGB: 1
databases:
  - name: docuflow-db
    plan: basic-256mb
